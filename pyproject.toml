[build-system]
requires = ["setuptools>=80", "wheel", "cython==3.2.4"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuscore-lib"
version = "0.4.0"
requires-python = ">=3.11"
# Imported lazily by `nexuscore.core.datetime`, only for datetime strings that
# are not valid ISO 8601. The same parser pandas defers to; ~3.5 MB resident.
dependencies = ["python-dateutil>=2.8.2"]
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools]
packages = ["nexuscore", "nexuscore.core", "nexuscore.model", "nexuscore.common", "nexuscore.serialization"]
# Ship only the compiled .so plus the declaration/stub files below; keep the
# generated .c intermediates and .pyx sources out of the binary wheel.
include-package-data = false

[tool.setuptools.package-data]
"nexuscore" = ["**/*.pxd", "**/*.pyi"]

[dependency-groups]
dev = [
    "cython>=3.2.8",
    "pandas>=3.0.5",
    "pytest>=8",
    "setuptools>=83.0.0",
]
